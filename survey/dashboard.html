<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>访谈记录看板</title>
<style>:root{--blue:#1a3a6b;--light:#4a7bc8;--gold:#c9a84c;--bg:#f5f6fa;--text:#2c3e50;--border:#dde3ed;--hint:#8895a7;--card:#fff;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.75;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,var(--blue),#2c5282);color:#fff;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header h1{font-size:1.25rem;font-weight:700}.header-btns{display:flex;gap:8px}.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}.btn:hover{background:rgba(255,255,255,.25)}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}.stats{display:flex;gap:0;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:28px}.stat-item{flex:1;text-align:center;padding:16px 8px;border-right:1px solid var(--border)}.stat-item:last-child{border-right:none}.stat-num{font-size:1.6rem;font-weight:800;color:var(--blue)}.stat-label{font-size:.72rem;color:var(--hint);margin-top:2px}
h2{font-size:1.05rem;font-weight:700;color:var(--hint);margin-bottom:14px;letter-spacing:.5px}.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px 22px;margin-bottom:12px;transition:.2s;display:block;color:inherit;text-decoration:none}.card:hover{border-color:var(--light);box-shadow:0 4px 16px rgba(26,58,107,.08);transform:translateY(-1px);text-decoration:none}.card-top{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:6px}.card-name{font-size:1.1rem;font-weight:700;color:var(--blue)}.card-date{font-size:.8rem;color:var(--hint);white-space:nowrap}.card-meta{font-size:.82rem;color:var(--hint);margin-bottom:8px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600}.tag-lang{background:#e3f2fd;color:#1565c0}.tag-done{background:#e8f5e9;color:#2e7d32}.tag-style{background:#eef2ff;color:var(--light)}.card-preview{font-size:.84rem;color:#555;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-cta{display:inline-block;margin-top:10px;font-size:.82rem;font-weight:600;color:var(--light)}</style>
</head>
<body>
<header>
<h1>📊 访谈记录看板</h1>

</header>
<div class="wrap">
  <div class="stats">
    <div class="stat-item">
<div class="stat-num">0</div>
<div class="stat-label">总案例</div>
</div>
    <div class="stat-item">
<div class="stat-num">0</div>
<div class="stat-label">已完成</div>
</div>
    <div class="stat-item">
<div class="stat-num">0</div>
<div class="stat-label">语言</div>
</div>
  </div>
  <h2>全部案例</h2>
  <div id="caseList"></div>
  <script src="cases/dashboard.js"></script>
</div>
</body>
</html>
